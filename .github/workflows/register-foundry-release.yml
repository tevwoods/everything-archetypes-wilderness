name: Register Foundry package release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub release tag, for example v1.2.3
        required: true
        type: string
      publish:
        description: Register live after validation (otherwise dry-run)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  register:
    runs-on: ubuntu-latest
    environment: foundry-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Register version with Foundry
        env:
          FOUNDRY_RELEASE_TOKEN: ${{ secrets.FOUNDRY_RELEASE_TOKEN }}
        run: |
          MODE=dry-run
          if [ "${{ inputs.publish }}" = "true" ]; then MODE=publish; fi
          node scripts/register-foundry-release.mjs "${{ inputs.tag }}" "$MODE"
